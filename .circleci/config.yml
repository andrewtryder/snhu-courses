version: 2.1

jobs:
  sync-course-catalog:
    docker:
      - image: cimg/node:24.13
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Apply database migrations
          command: npm run db:migrate
      - run:
          name: Synchronize course catalog
          command: |
            set -euo pipefail
            npm run catalog:sync | tee /tmp/catalog-sync.log
      - run:
          name: Revalidate production cache
          command: |
            set -euo pipefail
            if grep -q '"action":"promoted"' /tmp/catalog-sync.log; then
              curl \
                --fail \
                --silent \
                --show-error \
                --request POST \
                --header "Authorization: Bearer ${REVALIDATE_SECRET}" \
                "${SITE_URL}/api/revalidate"
            else
              echo "No catalog promotion occurred; skipping revalidation."
            fi

workflows:
  scheduled-catalog-sync:
    jobs:
      - sync-course-catalog:
          context:
            - snhu-courses-sync
          filters:
            branches:
              only: master
